@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans KR',sans-serif;background:#eef0f7;color:#1a1d2e;min-height:100vh;padding:22px 16px 60px;display:flex;justify-content:center;}
.wrap{width:100%;max-width:920px;}
.hd{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:14px;}
.ttl{font-size:1.4rem;font-weight:700;color:#1e2340;}
.chips{display:flex;gap:7px;flex-wrap:wrap;}
.chip{display:flex;align-items:center;gap:5px;background:#fff;border:1.5px solid #dde1ef;border-radius:20px;padding:4px 12px;font-size:.82rem;font-weight:600;color:#3a3f5c;box-shadow:0 1px 3px rgba(0,0,0,.06);}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.pb-wrap{background:#dde1ef;border-radius:20px;height:7px;margin-bottom:14px;overflow:hidden;display:flex;}
.pb{height:100%;transition:width .4s ease;}
.pb-g{background:#22c47a;}.pb-r{background:#f05252;}.pb-v{background:#7c5cbf;}.pb-y{background:#f5a623;}.pb-o{background:#e07b3a;}
.tb{display:flex;gap:7px;margin-bottom:12px;flex-wrap:wrap;align-items:center;}
.fb{background:#fff;border:1.5px solid #dde1ef;border-radius:8px;color:#6b7494;padding:5px 13px;font-size:.8rem;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s;white-space:nowrap;}
.fb:hover{border-color:#4f73d9;color:#4f73d9;}
.fb.on{background:#4f73d9;border-color:#4f73d9;color:#fff;}
.hs{background:#fff;border:1.5px solid #dde1ef;border-radius:8px;color:#3a3f5c;padding:5px 10px;font-size:.8rem;font-family:inherit;outline:none;cursor:pointer;}
.sr{flex:1;min-width:120px;background:#fff;border:1.5px solid #dde1ef;border-radius:8px;color:#1a1d2e;padding:5px 12px;font-size:.82rem;font-family:inherit;outline:none;transition:border-color .15s;}
.sr:focus{border-color:#4f73d9;}
.card{background:#fff;border-radius:14px;box-shadow:0 2px 16px rgba(30,40,90,.08);overflow:hidden;}
table{width:100%;border-collapse:collapse;font-size:.88rem;}
thead th{background:#f7f8fc;color:#7a82a8;font-weight:600;padding:10px 8px;text-align:center;border-bottom:2px solid #e8eaf4;font-size:.74rem;letter-spacing:.3px;position:sticky;top:0;z-index:10;white-space:nowrap;}
th.tn{text-align:left;padding-left:14px;}
tbody tr{border-bottom:1px solid #f0f2f9;transition:background .1s;}
tbody tr:last-child{border-bottom:none;}
tbody tr:hover{background:#f7f9ff;}
tbody tr.hidden{display:none;}
td{padding:8px 7px;vertical-align:middle;text-align:center;}
td.n{color:#b0b8d1;font-size:.75rem;width:32px;}
td.h{color:#8892b0;font-size:.78rem;font-weight:600;width:46px;}
td.nm{text-align:left;padding-left:14px;font-weight:700;font-size:.92rem;color:#1a1d2e;}
td.ph{color:#5a6280;font-size:.8rem;font-weight:500;white-space:nowrap;}
.sg{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;}
.sb{border:1.5px solid transparent;border-radius:7px;padding:4px 8px;font-size:.72rem;font-weight:700;cursor:pointer;font-family:inherit;opacity:.28;transition:opacity .15s,transform .1s,box-shadow .15s;white-space:nowrap;}
.sb:hover{opacity:.65;}
.sb.on{opacity:1;transform:scale(1.05);box-shadow:0 2px 8px rgba(0,0,0,.12);}

.sb-t{background:#fff8ec;border-color:#f5a623;color:#c47d00;}
.sb-no{background:#fff2e8;border-color:#e07b3a;color:#b05a10;}

.sb-ab{background:#fff0f0;border-color:#f05252;color:#c03030;}
.sb-ud{background:#f3f0ff;border-color:#7c5cbf;color:#5c3a9e;}

.mi{width:100%;border:1.5px solid #e0e4ef;border-radius:7px;padding:4px 7px;font-size:.76rem;font-family:inherit;color:#1a1d2e;background:#f8f9fc;outline:none;transition:border-color .15s,background .15s;}

tr.st-at{background:#f2fbf6!important;}tr.st-ab{background:#fff5f5!important;}
tr.st-ud{background:#f8f5ff!important;}tr.st-t{background:#fffbf2!important;}tr.st-no{background:#fff6ee!important;}

.sec td{background:#eef1fa;color:#4f73d9;font-weight:700;font-size:.8rem;padding:6px 14px;text-align:left;border-top:2px solid #d5daf0;}
